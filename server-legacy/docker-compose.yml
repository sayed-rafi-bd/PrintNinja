# PrintNinja share service (Rust; replaced by the TypeScript service in
# REFACTORING.md Phase 3).
#
#   cd server-legacy && docker compose up -d --build   # service on 0.0.0.0:3001
#
# Compose reads variables from a `.env` file next to this file (see
# ../env.example). The project name is pinned below, so the data volume stays
# `printninja_printninja-data` no matter which directory compose runs from.

name: printninja

services:
  printninja-server:
    build: .
    image: printninja-server:local
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - printninja-data:/data
    # Published on all interfaces by default, so it is reachable at
    # http://<public-ip>:3001 (also open TCP 3001 in the firewall / security group).
    # This is plain HTTP: passwords and tokens are unencrypted, and the login
    # throttle can be bypassed by faking X-Forwarded-For.
    # To restrict it to this host (e.g. behind an HTTPS reverse proxy on the same
    # machine), set SHARE_BIND=127.0.0.1 in .env.
    ports:
      - "${SHARE_BIND:-0.0.0.0}:3001:3001"

volumes:
  printninja-data:
