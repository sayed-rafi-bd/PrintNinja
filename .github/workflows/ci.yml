name: CI

on:
  push:
    # develop runs the checks only. Release jobs are gated on `v*` tags, and
    # version-check rejects any tag that is not on main.
    branches: [main, develop]
    # `create` events do not support tag filters, so tag builds must use `push`.
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Rust toolchain is pinned (dtolnay/rust-toolchain@1.90.0 below and
# rust-toolchain.toml). Bump all of them together.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      # Reused by the Rust jobs (tauri::generate_context! embeds ../dist),
      # so the frontend is only built once per run.
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
      - run: pnpm test

  rust-check:
    runs-on: ubuntu-latest
    needs: [web-check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev patchelf
      # tauri::generate_context! embeds ../dist, so the frontend must exist.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      # 1. Rust failures block: clippy and tests must pass (no continue-on-error).
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # The Rust share server is its own crate with its own 22 tests; they never
  # ran on a pull request (Phase 0, item 0.1). It lives in server-legacy/
  # since Phase 1 and is deleted at cutover (Phase 3).
  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-legacy
      - run: cargo test --manifest-path server-legacy/Cargo.toml

  # Phase 1: the TypeScript service. Integration tests need Docker for
  # Testcontainers (present on ubuntu-latest). The drift check regenerates
  # the OpenAPI document and fails on any difference, so the committed
  # file cannot go stale.
  server-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The generated client is gitignored, so a fresh clone builds it
      # first. Generate connects to nothing; the dummy URL only satisfies
      # config loading (same trick as the Dockerfile).
      - name: Generate the Prisma client
        run: |
          DATABASE_URL=postgresql://localhost:5432/printninja_ci_dummy \
          pnpm --filter server db:generate
      - run: pnpm --filter server typecheck
      - run: pnpm --filter server arch
      - run: pnpm --filter server test
      - name: OpenAPI drift check
        run: |
          DATABASE_URL=postgresql://user:pass@localhost:5432/printninja \
          CORS_ORIGINS=http://localhost:1420 \
          pnpm --filter server openapi:generate
          git diff --exit-code -- server/openapi/openapi.json

  # The Dockerfile must stay green independently of the compose stack.
  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the service image
        run: docker build -f server/Dockerfile -t printninja-server:ci .

  # E1 and E8 over HTTP against the composed stack (built image, real
  # PostgreSQL, real network port).
  server-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the stack
        run: |
          printf 'POSTGRES_PASSWORD=e2e-test-password\nCORS_ORIGINS=http://localhost:1420\n' > .env
          docker compose up -d --build --wait --wait-timeout 180
      - name: E1 and E8 against the running stack
        run: E2E_BASE_URL=http://localhost:3001 pnpm --filter server test:e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear the stack down
        if: always()
        run: docker compose down -v

  # The Playwright smoke spec: the app in Chromium against the harness
  # stack (own PostgreSQL, built service, fake desktop agent).
  app-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the Prisma client and build the service
        run: |
          DATABASE_URL=postgresql://localhost:5432/printninja_ci_dummy \
          pnpm --filter server db:generate
          pnpm --filter server build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium with system dependencies
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload the HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # 5. Windows is the shipped desktop target, so run the Rust tests there on
  # every PR/push instead of only discovering breakage during the tag build.
  rust-test-windows:
    runs-on: windows-latest
    needs: [web-check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # Tag builds must match the version in every manifest, otherwise the
  # artifacts get published under the wrong version. Runs for every
  # release tag (push tags v*), blocking windows/android/github-release.
  version-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be strict semver (vX.Y.Z)
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vX.Y.Z. Pre-release suffixes are not supported by the release pipeline."
            exit 1
          fi
      - name: Tagged commit must be on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA which is not reachable from main. Merge to main first, then tag."
            exit 1
          fi
          echo "[ok] $GITHUB_SHA is on main"
      - name: Compare tag with all manifests
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG=$(jq -r .version package.json)
          TAURI=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{gsub(/[" ]/,"",$3); print $3; exit}' src-tauri/Cargo.toml)
          # Cargo.lock stores the same version for the crate
          LOCK=$(awk '/^\[\[package\]\]/{p=0} /name = "printninja"/{p=1;next} p && /^version =/{gsub(/"/,"",$3); print $3; exit}' src-tauri/Cargo.lock)
          # Settings.tsx fallback literal "vX.Y.Z"
          SETTINGS=$(grep -o '"v[0-9]\+\.[0-9]\+\.[0-9]\+"' src/pages/Settings.tsx | head -n1 | tr -d '"' | sed 's/^v//')
          echo "tag=$TAG_VERSION package.json=$PKG tauri.conf.json=$TAURI Cargo.toml=$CARGO Cargo.lock=$LOCK Settings.tsx=$SETTINGS"
          for v in "$PKG" "$TAURI" "$CARGO" "$LOCK" "$SETTINGS"; do
            if [ -z "$v" ]; then
              echo "::error::Could not read a version (empty). Check manifests."
              exit 1
            fi
            if [ "$v" != "$TAG_VERSION" ]; then
              echo "::error::Version mismatch: tag is v$TAG_VERSION but a manifest says $v. Run scripts/release.sh --version $TAG_VERSION --tag and re-push."
              exit 1
            fi
          done
          echo "[ok] all versions match v$TAG_VERSION"

  windows-build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [web-check, rust-check, rust-test-windows, version-check]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Icon changed via `tauri icon` — Rust cache would restore old
      # target/release/build/printninja-*/out/resource.rc with stale ICO.
      # Windows runners default to pwsh, where `rm -rf` is `Remove-Item -rf`
      # and fails with "A parameter cannot be found that matches parameter
      # name 'rf'". Use bash explicitly.
      - name: Clear stale icon build cache
        shell: bash
        run: rm -rf src-tauri/target/release/build/printninja-* src-tauri/target/release/bundle || true
      - run: pnpm install --frozen-lockfile
      # MSI only. Without --target, output lands in target/release/bundle.
      - run: pnpm exec tauri build --bundles msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

  android-build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [web-check, rust-check, version-check]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Clear stale launcher icon cache
        run: rm -rf src-tauri/target/aarch64-linux-android src-tauri/gen/android/app/build || true
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK + NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | head -n 1)
          if [ -z "$SDKMANAGER" ]; then echo "::error::sdkmanager not found at \$ANDROID_HOME=$ANDROID_HOME"; ls -R "$ANDROID_HOME" | head -n 30; exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Generate Android project if not committed
        run: |
          if [ ! -d src-tauri/gen/android ]; then pnpm exec tauri android init --ci; fi
      # `tauri android init` regenerates res/mipmap-* from tauri.conf bundle.icon.
      # Copy the launchers that `tauri icon` actually generated (432px adaptive
      # foreground, anydpi-v26 xml + background colour) over them, otherwise the
      # APK ships Tauri placeholder art instead of the app icon.
      - name: Apply generated launcher icons
        run: |
          RES=src-tauri/gen/android/app/src/main/res
          cp -r src-tauri/icons/android/. "$RES"/
          find "$RES" -name 'ic_launcher*.png' -printf '%p %s\n' | sort
      # Light status and navigation bars, to match the app's single light theme.
      - name: Apply light Android theme
        run: node scripts/patch-android-theme.mjs
      - name: Make gradlew executable
        run: chmod +x src-tauri/gen/android/gradlew || true
      # arm64-v8a only (new mobiles). Debug APK is signed with debug keystore and installable for testing;
      # release AAB/unsigned APK stays local-only (sign before Play Store). Build debug for installable artifact.
      - run: pnpm exec tauri android build --target aarch64 --debug --apk --aab
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
            src-tauri/gen/android/app/build/outputs/**/*.aab
          if-no-files-found: error
          retention-days: 30

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [windows-build, android-build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PrintNinja ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-artifacts/*.msi
            dist-artifacts/**/*.apk
            dist-artifacts/**/*.aab
