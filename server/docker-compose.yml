# PrintNinja v2 stack (REFACTORING.md Phase 1, packaging): the TypeScript
# service plus PostgreSQL. First boot migrates the database itself (see
# ./docker-entrypoint.sh), so `docker compose up` lands healthy.
# Run from this directory: `docker compose up -d --build`.
# The env file is the `.env` next to this file (never committed).
#
# Two database modes:
# - Bundled (default): DATABASE_URL unset, compose builds it from
#   POSTGRES_PASSWORD against the `db` service below. `up -d --build`.
# - External: set DATABASE_URL in `.env` to your own PostgreSQL and start
#   only the server, so the bundled `db` never boots:
#     docker compose up -d --build --no-deps server
#   POSTGRES_PASSWORD is then unused. The database must exist, be empty,
#   and reachable from inside the container (`localhost` there means the
#   container itself); the role needs DDL rights for `migrate deploy`.
name: printninja

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: printninja
      # Bundled-db mode only. Default is the dev value from env.example;
      # set a real one for anything shared. Unused with external DATABASE_URL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme01}
      POSTGRES_DB: printninja
    volumes:
      # A dedicated volume (not the old share server's): mounting foreign
      # data at a PGDATA path would break initdb.
      - printninja-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printninja -d printninja"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Same variable name as the legacy service, different meaning:
      # the v2 service wants a PostgreSQL URL, not a SQLite path.
      # Unset: bundled `db` (built from POSTGRES_PASSWORD). Set: your own
      # PostgreSQL (start with `up --no-deps server`); URL-encode special
      # characters in the password (@ → %40, : → %3A, / → %2F, # → %23).
      DATABASE_URL: ${DATABASE_URL:-postgresql://printninja:${POSTGRES_PASSWORD:-changeme01}@db:5432/printninja}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:1420}
      HOST: 0.0.0.0
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      RATE_LIMIT_AUTH_WINDOW_SECONDS: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:-300}
    # Least privilege: the service binds an unprivileged port and needs
    # no Linux capabilities or privilege escalation.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Let in-flight requests finish on SIGTERM (see server/src/server.ts).
    stop_grace_period: 20s
    logging: *logging
    ports:
      - "${SERVER_PORT:-3001}:3001"

volumes:
  printninja-pgdata:
