# PrintNinja v2 stack (REFACTORING.md Phase 1, packaging): the TypeScript
# service plus PostgreSQL. First boot migrates the database itself (see
# ./docker-entrypoint.sh), so `docker compose up` lands healthy.
# Run from this directory: `docker compose up -d --build`.
# The env file is the `.env` next to this file (never committed).
name: printninja

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: printninja
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: printninja
    volumes:
      # A dedicated volume (not the old share server's): mounting foreign
      # data at a PGDATA path would break initdb.
      - printninja-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printninja"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Same variable name as the legacy service, different meaning:
      # the v2 service wants a PostgreSQL URL, not a SQLite path.
      DATABASE_URL: postgresql://printninja:${POSTGRES_PASSWORD}@db:5432/printninja
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:1420}
      HOST: 0.0.0.0
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      RATE_LIMIT_AUTH_WINDOW_SECONDS: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:-300}
    ports:
      - "${SERVER_PORT:-3001}:3001"

volumes:
  printninja-pgdata:
