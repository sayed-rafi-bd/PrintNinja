<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" role="img" aria-label="Printer with ninja mask">
  <defs>
    <clipPath id="body">
      <rect x="16" y="40" width="96" height="48" rx="12"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="128" height="128" rx="28" fill="#1F2937"/>

  <!-- input paper -->
  <rect x="38" y="16" width="52" height="30" rx="3" fill="#E5E7EB"/>
  <rect x="46" y="23" width="36" height="3" rx="1.5" fill="#9CA3AF"/>
  <rect x="46" y="30" width="26" height="3" rx="1.5" fill="#9CA3AF"/>

  <!-- output paper with shuriken -->
  <rect x="34" y="80" width="60" height="34" rx="3" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <path d="M64 92 L67.5 98.5 L74 100 L67.5 101.5 L64 108 L60.5 101.5 L54 100 L60.5 98.5 Z" fill="#E11D48"/>
  <circle cx="64" cy="100" r="1.8" fill="#FFFFFF"/>

  <!-- printer body -->
  <rect x="16" y="40" width="96" height="48" rx="12" fill="#F9FAFB"/>

  <!-- ninja mask band -->
  <g clip-path="url(#body)">
    <rect x="10" y="48" width="108" height="26" fill="#111827"/>
  </g>

  <!-- eyes -->
  <path d="M30 57 L54 62 Q55 66 50 67 L32 65 Z" fill="#FFFFFF"/>
  <path d="M98 57 L74 62 Q73 66 78 67 L96 65 Z" fill="#FFFFFF"/>
  <circle cx="47" cy="63.5" r="2.4" fill="#111827"/>
  <circle cx="81" cy="63.5" r="2.4" fill="#111827"/>

  <!-- headband tails -->
  <path d="M112 56 L124 48 L121 59 L126 68 L114 64 Z" fill="#E11D48"/>

  <!-- paper slot -->
  <rect x="28" y="82" width="72" height="3.5" rx="1.75" fill="#374151"/>

  <!-- status light -->
  <circle cx="100" cy="79" r="2" fill="#22C55E"/>
</svg>
