packages:
  - server
  - e2e

# Install scripts pnpm must run. Confirmed by the Phase 1 spike (item 2):
# esbuild postinstall, argon2's node-gyp-build and Prisma's engines are the
# only packages in this workspace with install scripts; @playwright/test has
# none (browsers come from `playwright install`).
allowBuilds:
  esbuild: true
  argon2: true
  prisma: true
  "@prisma/engines": true
  cpu-features: false
  protobufjs: false
  ssh2: false

# Temporary: pkg-types@2.4.0 (transitive) was published less than the
# minimumReleaseAge ago when the lockfile was generated. Remove this entry
# once the version is old enough to pass the policy on its own.
minimumReleaseAgeExclude:
  - pkg-types@2.4.0
